<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tohab" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1c20" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-256.png" sizes="256x256" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			// Resolve the stored theme before first paint so installs never flash the wrong palette.
			try {
				const stored = localStorage.getItem('tohab.theme') || 'system';
				const dark =
					stored === 'dark' ||
					(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
