services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tohab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tohab}
      POSTGRES_DB: ${POSTGRES_DB:-tohab}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql, not at .../data
      - tohab-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tohab} -d ${POSTGRES_DB:-tohab}']
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tohab}:${POSTGRES_PASSWORD:-tohab}@db:5432/${POSTGRES_DB:-tohab}
      CALENDAR_SECRET: ${CALENDAR_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5178/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      - server

volumes:
  tohab-pgdata:
