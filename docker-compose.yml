name: tohab

# Docker's default json-file driver keeps every line forever, and this stack runs
# unattended, so cap it at 30 MB per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tohab}
      POSTGRES_DB: ${POSTGRES_DB:-tohab}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgres_password
    ports:
      # Loopback only: Postgres is a direct route around the sync server's auth.
      # Override POSTGRES_PORT for local `drizzle-kit studio` work.
      - '${POSTGRES_PORT:-127.0.0.1:5432}:5432'
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql, not at .../data
      - tohab-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tohab} -d ${POSTGRES_DB:-tohab}']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/usr/local/bin/tohab-server-entrypoint"]
    secrets:
      - postgres_password
    volumes:
      - ./scripts/server-entrypoint.sh:/usr/local/bin/tohab-server-entrypoint:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tohab}
      POSTGRES_DB: ${POSTGRES_DB:-tohab}
      CALENDAR_SECRET: ${CALENDAR_SECRET:-}
      CALENDAR_PUBLIC_BASE_URL: ${CALENDAR_PUBLIC_BASE_URL:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:5178/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    logging: *logging
    ports:
      # Loopback by default, so a deployment opts in to a private address instead of
      # exposing the PWA on every interface.
      - '${WEB_PORT:-127.0.0.1:8080}:80'
    depends_on:
      - server

volumes:
  tohab-pgdata:

secrets:
  postgres_password:
    file: ${TOHAB_SECRETS_DIR:-./secrets}/postgres_password
