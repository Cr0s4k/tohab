services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tohab
      POSTGRES_PASSWORD: tohab
      POSTGRES_DB: tohab
    ports:
      - '5432:5432'
    volumes:
      # postgres:18+ wants a single mount at /var/lib/postgresql, not at .../data
      - tohab-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tohab -d tohab']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  tohab-pgdata:
