		<script>
			// Resolve the stored theme before first paint so installs never flash the wrong palette.
			try {
				const stored = localStorage.getItem('tohab.theme') || 'system';
				const dark =
					stored === 'dark' ||
					(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		<style>
			#splash {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.75rem;
				background: #fcfaf8;
				transition: opacity 260ms ease;
			}
			[data-theme='dark'] #splash {
				background: #1f1f1f;
			}
			#splash[data-leaving] {
				opacity: 0;
				pointer-events: none;
			}
			#splash img {
				width: 84px;
				height: 84px;
				border-radius: 20px;
				animation: splash-breathe 2.4s ease-in-out infinite;
			}
			#splash span {
				width: 1.5rem;
				height: 2px;
				border-radius: 999px;
				background: color-mix(in oklch, oklch(0.58 0.19 25) 35%, transparent);
				overflow: hidden;
				position: relative;
			}
			#splash span::after {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: oklch(0.58 0.19 25);
				animation: splash-sweep 1.1s ease-in-out infinite;
			}
			[data-theme='dark'] #splash span {
				background: color-mix(in oklch, #ee796c 35%, transparent);
			}
			[data-theme='dark'] #splash span::after {
				background: #ee796c;
			}
			@keyframes splash-breathe {
				0%,
				100% {
					opacity: 1;
					transform: scale(1);
				}
				50% {
					opacity: 0.82;
					transform: scale(0.97);
				}
			}
			@keyframes splash-sweep {
				0% {
					transform: translateX(-100%);
				}
				100% {
					transform: translateX(100%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash img,
				#splash span::after {
					animation: none;
				}
			}
		</style>
