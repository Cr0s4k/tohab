<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tohab" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1c20" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon-256.png" sizes="256x256" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<script>
			// Resolve the stored theme before first paint so installs never flash the wrong palette.
			try {
				const stored = localStorage.getItem('tohab.theme') || 'system';
				const dark =
					stored === 'dark' ||
					(stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		<style>
			#splash {
				position: fixed;
				inset: 0;
				z-index: 60;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.75rem;
				background: oklch(0.985 0.002 250);
				transition: opacity 260ms ease;
			}
			[data-theme='dark'] #splash {
				background: #1f1f1f;
			}
			#splash[data-leaving] {
				opacity: 0;
				pointer-events: none;
			}
			#splash img {
				width: 84px;
				height: 84px;
				border-radius: 20px;
				animation: splash-breathe 2.4s ease-in-out infinite;
			}
			#splash span {
				width: 1.5rem;
				height: 2px;
				border-radius: 999px;
				background: color-mix(in oklch, oklch(0.58 0.19 25) 35%, transparent);
				overflow: hidden;
				position: relative;
			}
			#splash span::after {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: inherit;
				background: oklch(0.58 0.19 25);
				animation: splash-sweep 1.1s ease-in-out infinite;
			}
			[data-theme='dark'] #splash span {
				background: color-mix(in oklch, #ee796c 35%, transparent);
			}
			[data-theme='dark'] #splash span::after {
				background: #ee796c;
			}
			@keyframes splash-breathe {
				0%,
				100% {
					opacity: 1;
					transform: scale(1);
				}
				50% {
					opacity: 0.82;
					transform: scale(0.97);
				}
			}
			@keyframes splash-sweep {
				0% {
					transform: translateX(-100%);
				}
				100% {
					transform: translateX(100%);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#splash img,
				#splash span::after {
					animation: none;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
		<div id="splash">
			<img src="%sveltekit.assets%/icons/icon-192.png" alt="" />
			<span></span>
		</div>

	</body>
</html>
