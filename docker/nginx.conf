server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;


	location / {
		try_files $uri $uri/ /index.html;
	}

	location = /service-worker.js {
		add_header Cache-Control "no-cache";
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
	}

	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location /auth {
		proxy_pass http://server:5178;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /calendar {
		proxy_pass http://server:5178;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /push {
		proxy_pass http://server:5178;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /sync {
		proxy_pass http://server:5178;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# /sync/events is SSE: no buffering, no idle timeout shorter than the 25s keepalive
		proxy_buffering off;
		proxy_cache off;
		proxy_read_timeout 1h;
	}
}
